<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divers — RAW RP</title><link rel="stylesheet" href="style.css"><style>.rule-card{cursor:pointer;transition:transform .2s,border-color .2s}.rule-card:hover,.rule-card:focus-visible{transform:translateY(-4px);border-color:#3beeea;outline:2px solid #3beeea}.rule-card:after{content:"En savoir plus ↗";display:block;color:#3beeea;margin-top:18px;font-size:13px}.rule-dialog{box-sizing:border-box;width:min(850px,92vw);max-height:85vh;overflow:auto;background:#101b1c;color:#b4c2c2;border:1px solid #3beeea;border-radius:12px;padding:clamp(24px,5vw,56px);box-shadow:0 0 50px #3beeea20}.rule-dialog::backdrop{background:#050909cc;backdrop-filter:blur(6px)}.rule-dialog h2{font-size:clamp(28px,5vw,48px);color:#eaf4f4}.rule-dialog p{font-size:19px;line-height:1.7}.rule-close{float:right;background:transparent;border:1px solid #3beeea;color:#3beeea;padding:10px 16px;cursor:pointer;border-radius:6px}.rule-dialog[open]{animation:rule-in .2s ease-out}@keyframes rule-in{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}</style></head><body><header><a class="brand" href="index.html">RAW<span> / RP</span></a><button id="menu" aria-label="Menu">☰</button><nav id="nav"><a href="index.html">Accueil</a><a href="reglement.html">Règlement</a><a href="astuces.html">Astuces</a><a href="reseaux.html">Réseaux</a><a href="galerie.html">Galerie</a><a href="divers.html" aria-current="page">Divers</a><a class="cta" href="rejoindre.html">Rejoindre ↗</a></nav></header><main class="inner-page"><section id="divers" class="wrap"><p class="eyebrow">01 / LE SERVEUR</p><h2>Ce qui t’attend<span>.</span></h2><div class="cards rule-cards" id="features"></div></section><section class="wrap lore"><p class="eyebrow">02 / LE LORE</p><h2>Prologue<span>.</span></h2><div class="lorebox"><p class="eyebrow" id="page"></p><h3 id="loretitle"></h3><p id="loretext"></p><div class="actions"><button id="prev" class="outline">←</button><button id="next" class="outline">→</button></div></div></section><p id="notice" role="status" class="page-notice"></p></main><footer>RAW / RP <span>© 2026 — Non affilié à Rockstar Games.</span></footer><script src="config.js"></script><script src="script.js"></script><script>document.querySelectorAll('#features article').forEach((c,i)=>{c.classList.add('rule-card');c.querySelector('b').classList.add('rule-number');const s=document.createElement('span');s.className='rule-icon';s.setAttribute('aria-hidden','true');s.textContent=['💼','🛡️','👥','🚗','🎙️','🤝'][i]||'◆';c.prepend(s)});</script><dialog class="rule-dialog" id="rule-dialog" aria-labelledby="rule-title"><button class="rule-close" type="button" aria-label="Fermer">✕</button><div id="rule-symbol" class="rule-icon"></div><h2 id="rule-title"></h2><p id="rule-text"></p></dialog><script>(()=>{const d=document.getElementById('rule-dialog');let previous;document.querySelectorAll('.rule-card').forEach(c=>{c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-haspopup','dialog');const open=()=>{previous=c;document.getElementById('rule-title').textContent=c.querySelector('h3').textContent;document.getElementById('rule-text').textContent=c.querySelector('p').textContent;document.getElementById('rule-symbol').textContent=c.querySelector('.rule-icon').textContent;d.showModal()};c.addEventListener('click',open);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});d.querySelector('button').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d){const b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close()}});d.addEventListener('close',()=>previous?.focus())})();</script></body></html>
