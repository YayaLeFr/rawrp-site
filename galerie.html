<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galerie — RAW RP</title><link rel="stylesheet" href="style.css"><style>.photo-stack{max-width:900px;margin:55px auto 35px;position:relative}.photo-stage{position:relative;aspect-ratio:16/9;isolation:isolate;margin:0 14px 28px}.photo-stage:before,.photo-stage:after{content:"";position:absolute;inset:0;background:#152728;border:1px solid #365354;border-radius:10px;z-index:-1;transform:rotate(-2.5deg) translateY(8px)}.photo-stage:after{transform:rotate(2.5deg) translateY(8px);z-index:-2}.photo-frame{position:relative;margin:0;height:100%;overflow:hidden;border:1px solid #3beeea55;border-radius:10px;background:#101b1c;box-shadow:0 15px 40px #0008}.photo-frame img{width:100%;height:100%;object-fit:cover;display:block}.photo-frame figcaption{position:absolute;inset:auto 0 0;padding:45px 24px 22px;background:linear-gradient(transparent,#080f10ed);text-align:left;color:#eaf4f4;font-size:clamp(14px,2vw,20px)}.photo-controls{display:flex;align-items:center;justify-content:center;gap:20px}.photo-controls button{background:#101b1c;color:#3beeea;border:1px solid #3beeea;padding:12px 20px;border-radius:5px;cursor:pointer}.photo-controls button:disabled{opacity:.35;cursor:default}.photo-counter{color:#b4c2c2;font-variant-numeric:tabular-nums}.photo-frame img{animation:photo-in .25s ease-out}@keyframes photo-in{from{opacity:.5}to{opacity:1}}@media(max-width:600px){.photo-stage{aspect-ratio:4/3}.photo-frame figcaption{padding:30px 14px 14px}}</style></head><body><header><a class="brand" href="index.html">RAW<span> / RP</span></a><button id="menu" aria-label="Menu">☰</button><nav id="nav"><a href="index.html">Accueil</a><a href="reglement.html">Règlement</a><a href="astuces.html">Astuces</a><a href="reseaux.html">Réseaux</a><a href="galerie.html" aria-current="page">Galerie</a><a href="divers.html">Divers</a><a class="cta" href="rejoindre.html">Rejoindre ↗</a></nav></header><main class="inner-page"><section id="galerie" class="wrap"><p class="eyebrow">05 / EN IMAGES</p><h2>Galerie<span>.</span></h2><div class="photo-stack"><div class="photo-stage"><figure class="photo-frame"><img id="gallery-photo" src="fond.jpg" alt="Los Santos au coucher du soleil"><figcaption id="gallery-caption">Los Santos s’illumine au coucher du soleil.</figcaption></figure></div><div class="photo-controls"><button id="gallery-prev" type="button" aria-label="Image précédente">←</button><span id="gallery-count" class="photo-counter" aria-live="polite">01 / 01</span><button id="gallery-next" type="button" aria-label="Image suivante">→</button></div></div></section><p id="notice" role="status" class="page-notice"></p></main><footer>RAW / RP <span>© 2026 — Non affilié à Rockstar Games.</span></footer><script src="config.js"></script><script src="script.js"></script><script>(()=>{const photos=[{src:'fond.jpg',alt:'Los Santos au coucher du soleil',caption:'Los Santos s’illumine au coucher du soleil.'}];let n=0;const img=document.getElementById('gallery-photo'),caption=document.getElementById('gallery-caption'),count=document.getElementById('gallery-count'),prev=document.getElementById('gallery-prev'),next=document.getElementById('gallery-next');function render(){const p=photos[n];img.src=p.src;img.alt=p.alt;caption.textContent=p.caption;count.textContent=String(n+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');prev.disabled=next.disabled=photos.length<2}function move(d){n=(n+d+photos.length)%photos.length;render()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);render()})();</script><script src="content-editor.js"></script></body></html>
