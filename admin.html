<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — RAW RP</title><link rel="stylesheet" href="style.css"><style>form{display:grid;gap:16px;max-width:420px;margin:30px auto}input,textarea{padding:14px;background:#101b1c;color:white;border:1px solid #3beeea66;border-radius:8px}button{cursor:pointer} [hidden]{display:none!important}body{background:#040908}main.inner-page{min-height:100vh;background:radial-gradient(ellipse at center,#10201c,#040908 75%)}main .wrap{max-width:1100px}#panel{max-width:640px;margin:20px auto;background:#080f0e;border:1px solid #263532;border-radius:6px;padding:24px;box-sizing:border-box}#panel h3{font-size:18px;text-transform:uppercase;margin:12px 0}#panel .owner-title{font-family:Impact,'Arial Narrow',sans-serif;font-size:27px;letter-spacing:.3px;color:#e3eeeb;margin:0}#panel .owner-sub{color:#81928d;font-size:13px;margin:8px 0 20px}#panel .owner-status{display:flex;justify-content:space-between;border-block:1px solid #263532;padding:15px 0;color:#3beeea;font-size:13px}#panel .owner-actions{display:grid;gap:10px;margin:20px 0}#panel .owner-actions button,#panel .owner-actions a{display:block;text-align:center;padding:14px;border:1px solid #263532;border-radius:4px;color:#e3eeeb;background:transparent;text-decoration:none}#panel .owner-actions #continue{background:#19dfb5;color:#04110e;font-weight:900;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}#page-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 24px}#page-buttons button{display:flex;justify-content:space-between;background:transparent;border:1px solid transparent;color:#e3eeeb;padding:15px;text-align:left}#page-buttons button:hover,#page-buttons button.active{border-color:#19dfb5;color:#19dfb5}#panel .owner-footer{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #263532;padding-top:16px}#panel .owner-footer button{font-size:12px;padding:12px}#panel.editing{max-width:1100px}#panel:not(.editing) #preview{display:none}#panel:not(.editing) #edit-hint{display:none}#panel #editpage{display:none}#panel #announcement-tools{margin-top:20px}#panel textarea{width:100%;box-sizing:border-box}#panel button:disabled{opacity:.4}#panel .close-owner{float:right;background:none;border:0;color:#aabbb6;font-size:22px}#panel .owner-footer #publish{background:#19dfb5;color:#04110e}#panel #approvals{border-top:1px solid #263532;margin-top:20px;padding-top:10px}@media(max-width:500px){#panel{padding:16px}#page-buttons{grid-template-columns:1fr}}#panel.editing{max-width:none;border:0;padding:0;background:transparent}#panel.editing #preview{height:calc(100vh - 65px)!important;margin:0!important;border:0!important}body:has(#panel.editing)>header,body:has(#panel.editing) main>.wrap>h2{display:none}body:has(#panel.editing) main>.wrap{max-width:none;padding:0}#panel.editing>:not(#preview):not(#floating-owner){display:none!important}#floating-owner{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;background:#080f0e;color:#e3eeeb;border:1px solid #3beeea;border-radius:5px;padding:14px 22px;box-shadow:0 0 0 7px #080f0e}#panel.editing #floating-owner{display:block}</style></head><body><header><a class="brand" href="index.html">RAW / RP</a></header><main class="inner-page"><section class="wrap"><h2>Administration</h2><form id="login"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button class="cta">Se connecter</button><button type="button" id="signup" class="outline">Créer mon compte</button></form><p id="status" role="status"></p><section id="panel" hidden><button class="close-owner" id="close-owner" aria-label="Fermer">×</button><h3 class="owner-title">♧ PANNEAU ADMINISTRATEUR</h3><p class="owner-sub">RAW RP · Accès privé</p><div class="owner-status"><span>Édition active</span><span id="pending">0 modification en attente</span></div><div class="owner-actions"><button id="continue">✎ CONTINUER LES MODIFICATIONS →</button><a href="index.html" target="_blank" rel="noopener">◉ Voir le site</a></div><section id="approvals" hidden><h3>Validation des administrateurs</h3><div id="approval-list"></div></section><details id="announcement-tools"><summary>Annonce du site</summary><textarea id="announcement" maxlength="2000" rows="5"></textarea><button id="save" class="cta">Enregistrer</button></details><h3>MES PAGES</h3><div id="page-buttons"><button type="button" data-page="index"><span>⌂　Accueil</span><span>→</span></button><button type="button" data-page="reglement"><span>▤　Règlement</span><span>→</span></button><button type="button" data-page="astuces"><span>♧　Astuces</span><span>→</span></button><button type="button" data-page="reseaux"><span>◯　Réseaux</span><span>→</span></button><button type="button" data-page="galerie"><span>▧　Galerie</span><span>→</span></button><button type="button" data-page="divers"><span>▦　Divers</span><span>→</span></button><button type="button" data-page="rejoindre"><span>↪　Rejoindre</span><span>→</span></button></div><select id="editpage" style="padding:12px;background:#101b1c;color:white"><option value="index">Accueil</option><option value="reglement">Règlement</option><option value="astuces">Astuces</option><option value="reseaux">Réseaux</option><option value="galerie">Galerie</option><option value="divers">Divers</option><option value="rejoindre">Rejoindre</option></select><p id="edit-hint">Clique sur un texte, une image ou un lien dans la page ci-dessous pour le modifier.</p><div id="editfields" hidden></div><div class="owner-footer"><button id="publish" class="cta" disabled>▣ ENREGISTRER</button><button id="cancel" class="outline">↶ Annuler les modifications</button><button id="logout" class="outline">↪ Se déconnecter</button></div><iframe id="preview" title="Édition visuelle" style="width:100%;height:75vh;margin-top:24px;border:1px solid #3beeea"></iframe><button id="floating-owner">☷ Panneau propriétaire</button></section></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const s=createClient('https://lbnzlomhigogpcjvqluo.supabase.co','sb_publishable_46D0xxSoT8ebww-sxV_YLQ_WQnA-OOV');const $=id=>document.getElementById(id);async function check(){const {data:{user}}=await s.auth.getUser();if(!user)return;const {data,error}=await s.from('rawrp_admins').select('email,approved').eq('email',user.email.toLowerCase()).maybeSingle();if(error||!data){await s.auth.signOut();$('status').textContent='Accès non autorisé.';return} if(!data.approved){await s.auth.signOut();$('status').textContent='Compte en attente de validation par le super-administrateur.';return}if(user.email.toLowerCase()==='yannicktecher50@gmail.com'){ document.querySelector('.owner-title').textContent='♧ PANNEAU PROPRIÉTAIRE';$('approvals').hidden=false;await approvals();} $('login').hidden=true;$('panel').hidden=false;const a=await s.from('rawrp_announcements').select('body').eq('id',1).single();$('announcement').value=a.data?.body||'';openPage();} $('login').onsubmit=async e=>{e.preventDefault();const {error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';$('status').textContent=error?'Identifiants incorrects.':'';if(!error)await check()};$('signup').onclick=async()=>{if(!$('login').reportValidity())return;if($('password').value.length<12){$('status').textContent='Choisis un mot de passe de 12 caractères minimum.';return}const {error}=await s.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:'https://yayalefr.github.io/rawrp-site/admin.html'}});$('password').value='';$('status').textContent=error?'Création impossible : '+error.message:'Vérifie ta boîte mail pour confirmer ton compte. Seules les adresses autorisées ont accès au panel.';if(!error)await check()};$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};$('save').onclick=async()=>{const {data,error}=await s.from('rawrp_announcements').update({body:$('announcement').value}).eq('id',1).select('id');$('status').textContent=error||!data?.length?'Enregistrement refusé.':'Annonce enregistrée.'};async function approvals(){const {data,error}=await s.from('rawrp_admins').select('email,approved');const list=$('approval-list');list.replaceChildren();if(error){list.textContent='Chargement impossible';return}for(const a of data.filter(x=>x.email!=='yannicktecher50@gmail.com')){const row=document.createElement('p');row.textContent=a.email+' — '+(a.approved?'Autorisé':'Non autorisé')+' ';const b=document.createElement('button');b.className='outline';b.textContent=a.approved?'Retirer accès':'Approuver';b.onclick=async()=>{const {data,error}=await s.from('rawrp_admins').update({approved:!a.approved}).eq('email',a.email).select('email');if(error||!data?.length)alert('Modification refusée');await approvals()};row.append(b);list.append(row)}}let generation=0,draft={},dirty=false;function openPage(){const g=++generation,frame=$('preview');$('publish').disabled=true;dirty=false;$('pending').textContent='0 modification en attente';draft={};frame.onload=async()=>{try{for(let i=0;i<100&&!frame.contentWindow.RAW_EDITOR;i++)await new Promise(r=>setTimeout(r,100));const ed=frame.contentWindow.RAW_EDITOR;if(!ed||g!==generation)return;await ed.ready;if(g!==generation)return;const page=$('editpage').value;const {data,error}=await s.from('rawrp_content').select('fields').eq('page',page).single();if(error){$('status').textContent='Chargement impossible.';return}draft={...data.fields};const doc=frame.contentDocument;const nodes=Array.from(doc.querySelectorAll('main h2,main h3,main p:not(#notice):not(#page):not(#loretext),main li,main figcaption,main .tips-badge,main .social-badge,main small,main img,main a[data-network]')).filter(e=>!e.closest('#panel')&&e.id!=='loretitle');const style=doc.createElement('style');style.textContent='[data-raw-edit]{cursor:text!important;outline:1px dashed #19dfb5!important;outline-offset:3px}[data-raw-edit]:hover{background:#19dfb512!important;outline:2px dashed #3beeea!important}main .cards,main .tips-grid{grid-template-columns:repeat(2,minmax(0,1fr))}main article{border-radius:6px} @media(max-width:700px){main .cards,main .tips-grid{grid-template-columns:1fr}}';doc.head.append(style);nodes.forEach((e,i)=>e.dataset.rawEdit=String(i));doc.addEventListener('click',ev=>{const e=ev.target.closest('[data-raw-edit]');if(!e){const a=ev.target.closest('header a');if(a){ev.preventDefault();ev.stopImmediatePropagation();const page=new URL(a.href).pathname.split('/').pop().replace('.html','')||'index';const b=document.querySelector('[data-page="'+page+'"]');if(b)b.click();return}if(ev.target.closest('a')){ev.preventDefault();ev.stopImmediatePropagation()}return}ev.preventDefault();ev.stopImmediatePropagation();const f=ed.fields().find(x=>x.id===e.dataset.rawEdit);if(!f)return;const v=prompt(f.kind==='image'?'Adresse de la nouvelle image':f.kind==='link'?'Adresse HTTPS du lien':'Modifier le texte',draft[f.id]??f.value);if(v===null)return;if(f.kind!=='text'&&v){try{const u=new URL(v,frame.contentWindow.location.href);if(u.protocol!=='https:')throw Error()}catch{alert('Adresse HTTPS invalide');return}}draft[f.id]=v;ed.apply({[f.id]:v});dirty=true;$('pending').textContent='Modifications en attente';$('publish').disabled=false;$('status').textContent='Modification non enregistrée.'},true)}catch(e){$('status').textContent='Impossible de charger le mode édition.'}};frame.src=$('editpage').value+'.html'}let previousPage=$('editpage').value;$('editpage').onchange=()=>{if(dirty&&!confirm('Abandonner les modifications non enregistrées ?')){$('editpage').value=previousPage;return}previousPage=$('editpage').value;openPage()};$('cancel').onclick=()=>{if(!dirty||confirm('Annuler les modifications ?'))openPage()};$('publish').onclick=async()=>{const page=$('editpage').value;$('publish').disabled=true;const {data,error}=await s.from('rawrp_content').update({fields:draft}).eq('page',page).select('page');$('status').textContent=error||!data?.length?'Enregistrement refusé.':'Modifications enregistrées.';if(!error&&data?.length){dirty=false;openPage()}else $('publish').disabled=false};$('floating-owner').onclick=()=>{$('panel').classList.remove('editing');window.scrollTo(0,0)};$('continue').onclick=()=>{$('panel').classList.add('editing');$('preview').scrollIntoView({behavior:'smooth'})};$('close-owner').onclick=()=>{if(dirty&&!confirm('Quitter sans enregistrer ?'))return;location.href='index.html'};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('Abandonner les modifications non enregistrées ?'))return;$('editpage').value=b.dataset.page;previousPage=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));$('panel').classList.add('editing');openPage()});check();</script></body></html>
