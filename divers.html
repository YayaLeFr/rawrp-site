<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divers — RAW RP</title><link rel="stylesheet" href="style.css"><style>.rule-card{cursor:pointer;transition:transform .2s,border-color .2s}.rule-card:hover,.rule-card:focus-visible{transform:translateY(-4px);border-color:#3beeea;outline:2px solid #3beeea}.rule-card:after{content:"En savoir plus ↗";display:block;color:#3beeea;margin-top:18px;font-size:13px}.rule-dialog{box-sizing:border-box;width:min(850px,92vw);max-height:85vh;overflow:auto;background:#101b1c;color:#b4c2c2;border:1px solid #3beeea;border-radius:12px;padding:clamp(24px,5vw,56px);box-shadow:0 0 50px #3beeea20}.rule-dialog::backdrop{background:#050909cc;backdrop-filter:blur(6px)}.rule-dialog h2{font-size:clamp(28px,5vw,48px);color:#eaf4f4}.rule-dialog p{font-size:19px;line-height:1.7}.rule-close{float:right;background:transparent;border:1px solid #3beeea;color:#3beeea;padding:10px 16px;cursor:pointer;border-radius:6px}.rule-dialog[open]{animation:rule-in .2s ease-out}@keyframes rule-in{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}} .rule-dialog{margin:auto;width:min(900px,94vw);max-height:94vh;background:#0e1715;padding:44px;min-height:420px}.rule-dialog h2{color:#19dfb5;margin-bottom:36px}#rule-text{font-size:16px;line-height:1.8;white-space:pre-wrap}#rule-text h3,#rule-text h4{font-size:18px;letter-spacing:2px;text-transform:uppercase;margin:32px 0 16px;color:#d0d9d6}#rule-text ul,#rule-text ol{padding-left:24px}#rule-text li{margin:12px 0}#rule-text li::marker{color:#19dfb5}.rule-card>ul{display:none}.rule-card .raw-detail{display:none!important}.misc-news{text-align:center;padding-top:65px;padding-bottom:75px}.misc-news .eyebrow{display:inline-block;background:var(--primary);color:#081414;padding:7px 24px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}.misc-news .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:45px;text-align:left}.misc-news article{border-radius:16px}.misc-news h3{text-transform:uppercase}@media(max-width:700px){.misc-news .cards{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">RAW<span> / RP</span></a><button id="menu" aria-label="Menu">☰</button><nav id="nav"><a href="index.html">Accueil</a><a href="reglement.html">Règlement</a><a href="astuces.html">Astuces</a><a href="reseaux.html">Réseaux</a><a href="galerie.html">Galerie</a><a href="divers.html" aria-current="page">Divers</a><a class="cta" href="rejoindre.html">Rejoindre ↗</a></nav></header><main class="inner-page"><section id="divers" class="wrap"><p class="eyebrow">01 / LE SERVEUR</p><h2>Ce qui t’attend<span>.</span></h2><div class="cards rule-cards" id="features"></div></section><section class="wrap lore"><p class="eyebrow">02 / LE LORE</p><h2>Prologue<span>.</span></h2><div class="lorebox"><p class="eyebrow" id="page"></p><h3 id="loretitle"></h3><p id="loretext"></p><div class="actions"><button id="prev" class="outline">←</button><button id="next" class="outline">→</button></div></div></section><section class="wrap misc-news"><p class="eyebrow">EN VRAC</p><h2>Divers<span>.</span></h2><div class="cards"><article><h3>Derniers votants</h3><p>Aucune infos</p></article><article><h3>Calendrier des events</h3><p>Aucune infos</p></article><article><h3>Patch notes</h3><p>Aucune infos</p></article></div></section><p id="notice" role="status" class="page-notice"></p></main><footer>RAW / RP <span>© 2026 — Non affilié à Rockstar Games.</span></footer><script src="config.js"></script><script src="script.js"></script><script>document.querySelectorAll('#features article').forEach((c,i)=>{c.classList.add('rule-card');c.querySelector('b').classList.add('rule-number');const s=document.createElement('span');s.className='rule-icon';s.setAttribute('aria-hidden','true');s.textContent=['💼','🛡️','👥','🚗','🎙️','🤝'][i]||'◆';c.prepend(s)});</script><dialog class="rule-dialog" id="rule-dialog" aria-labelledby="rule-title"><button class="rule-close" type="button" aria-label="Fermer">✕</button><div id="rule-symbol" class="rule-icon"></div><h2 id="rule-title"></h2><div id="rule-text"></div></dialog><script>(()=>{const d=document.getElementById('rule-dialog');let previous;document.querySelectorAll('.rule-card').forEach(c=>{c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-haspopup','dialog');const open=()=>{previous=c;document.getElementById('rule-title').textContent=c.querySelector('h3').textContent;const body=document.getElementById('rule-text');const detail=c.querySelector('.raw-detail');if(detail)body.replaceChildren(...Array.from(detail.childNodes,n=>n.cloneNode(true)));else body.textContent=c.querySelector('p').textContent;d.rawCard=c;document.getElementById('rule-symbol').textContent=c.querySelector('.rule-icon').textContent;d.showModal()};c.addEventListener('click',open);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});d.querySelector('button').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d){const b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close()}});d.addEventListener('close',()=>previous?.focus())})();</script></body></html>
