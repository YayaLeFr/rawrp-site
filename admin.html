<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — RAW RP</title><link rel="stylesheet" href="style.css"><style>form{display:grid;gap:16px;max-width:420px;margin:30px auto}input,textarea{padding:14px;background:#101b1c;color:white;border:1px solid #3beeea66;border-radius:8px}button{cursor:pointer} [hidden]{display:none!important}</style></head><body><header><a class="brand" href="index.html">RAW / RP</a></header><main class="inner-page"><section class="wrap"><h2>Administration</h2><form id="login"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button class="cta">Se connecter</button><button type="button" id="signup" class="outline">Créer mon compte</button></form><p id="status" role="status"></p><section id="panel" hidden><h3>Panel RAW RP</h3><button id="logout" class="outline">Déconnexion</button><h3>Annonce</h3><textarea id="announcement" maxlength="2000" rows="5"></textarea><button id="save" class="cta">Enregistrer</button><h3>Modifier une page</h3><select id="editpage" style="padding:12px;background:#101b1c;color:white"><option value="index">Accueil</option><option value="reglement">Règlement</option><option value="astuces">Astuces</option><option value="reseaux">Réseaux</option><option value="galerie">Galerie</option><option value="divers">Divers</option><option value="rejoindre">Rejoindre</option></select><p>Clique sur un texte, une image ou un lien dans la page ci-dessous pour le modifier.</p><div id="editfields" hidden></div><button id="publish" class="cta" disabled>Enregistrer les modifications</button> <button id="cancel" class="outline">Annuler</button><iframe id="preview" title="Édition visuelle" style="width:100%;height:75vh;margin-top:24px;border:1px solid #3beeea"></iframe></section></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const s=createClient('https://lbnzlomhigogpcjvqluo.supabase.co','sb_publishable_46D0xxSoT8ebww-sxV_YLQ_WQnA-OOV');const $=id=>document.getElementById(id);async function check(){const {data:{user}}=await s.auth.getUser();if(!user)return;const {data,error}=await s.from('rawrp_admins').select('email').maybeSingle();if(error||!data){await s.auth.signOut();$('status').textContent='Accès non autorisé.';return} $('login').hidden=true;$('panel').hidden=false;const a=await s.from('rawrp_announcements').select('body').eq('id',1).single();$('announcement').value=a.data?.body||'';openPage();} $('login').onsubmit=async e=>{e.preventDefault();const {error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';$('status').textContent=error?'Identifiants incorrects.':'';if(!error)await check()};$('signup').onclick=async()=>{if(!$('login').reportValidity())return;if($('password').value.length<12){$('status').textContent='Choisis un mot de passe de 12 caractères minimum.';return}const {error}=await s.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:'https://yayalefr.github.io/rawrp-site/admin.html'}});$('password').value='';$('status').textContent=error?'Création impossible : '+error.message:'Vérifie ta boîte mail pour confirmer ton compte. Seules les adresses autorisées ont accès au panel.';if(!error)await check()};$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};$('save').onclick=async()=>{const {data,error}=await s.from('rawrp_announcements').update({body:$('announcement').value}).eq('id',1).select('id');$('status').textContent=error||!data?.length?'Enregistrement refusé.':'Annonce enregistrée.'};let generation=0,draft={},dirty=false;function openPage(){const g=++generation,frame=$('preview');$('publish').disabled=true;dirty=false;draft={};frame.onload=async()=>{try{for(let i=0;i<100&&!frame.contentWindow.RAW_EDITOR;i++)await new Promise(r=>setTimeout(r,100));const ed=frame.contentWindow.RAW_EDITOR;if(!ed||g!==generation)return;await ed.ready;if(g!==generation)return;const page=$('editpage').value;const {data,error}=await s.from('rawrp_content').select('fields').eq('page',page).single();if(error){$('status').textContent='Chargement impossible.';return}draft={...data.fields};const doc=frame.contentDocument;const nodes=Array.from(doc.querySelectorAll('main h2,main h3,main p:not(#notice):not(#page):not(#loretext),main li,main figcaption,main .tips-badge,main .social-badge,main small,main img,main a[data-network]')).filter(e=>!e.closest('#panel')&&e.id!=='loretitle');const style=doc.createElement('style');style.textContent='[data-raw-edit]{cursor:cell!important}[data-raw-edit]:hover{outline:2px dashed #3beeea!important;outline-offset:4px}';doc.head.append(style);nodes.forEach((e,i)=>e.dataset.rawEdit=String(i));doc.addEventListener('click',ev=>{const e=ev.target.closest('[data-raw-edit]');if(!e){if(ev.target.closest('a')){ev.preventDefault();ev.stopImmediatePropagation()}return}ev.preventDefault();ev.stopImmediatePropagation();const f=ed.fields().find(x=>x.id===e.dataset.rawEdit);if(!f)return;const v=prompt(f.kind==='image'?'Adresse de la nouvelle image':f.kind==='link'?'Adresse HTTPS du lien':'Modifier le texte',draft[f.id]??f.value);if(v===null)return;if(f.kind!=='text'&&v){try{const u=new URL(v,frame.contentWindow.location.href);if(u.protocol!=='https:')throw Error()}catch{alert('Adresse HTTPS invalide');return}}draft[f.id]=v;ed.apply({[f.id]:v});dirty=true;$('publish').disabled=false;$('status').textContent='Modification non enregistrée.'},true)}catch(e){$('status').textContent='Impossible de charger le mode édition.'}};frame.src=$('editpage').value+'.html'}let previousPage=$('editpage').value;$('editpage').onchange=()=>{if(dirty&&!confirm('Abandonner les modifications non enregistrées ?')){$('editpage').value=previousPage;return}previousPage=$('editpage').value;openPage()};$('cancel').onclick=()=>{if(!dirty||confirm('Annuler les modifications ?'))openPage()};$('publish').onclick=async()=>{const page=$('editpage').value;$('publish').disabled=true;const {data,error}=await s.from('rawrp_content').update({fields:draft}).eq('page',page).select('page');$('status').textContent=error||!data?.length?'Enregistrement refusé.':'Modifications enregistrées.';if(!error&&data?.length){dirty=false;openPage()}else $('publish').disabled=false};check();</script></body></html>
