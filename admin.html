<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — RAW RP</title><link rel="stylesheet" href="style.css"><style>form{display:grid;gap:16px;max-width:420px;margin:30px auto}input,textarea{padding:14px;background:#101b1c;color:white;border:1px solid #3beeea66;border-radius:8px}button{cursor:pointer} [hidden]{display:none!important}</style></head><body><header><a class="brand" href="index.html">RAW / RP</a></header><main class="inner-page"><section class="wrap"><h2>Administration</h2><form id="login"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button class="cta">Se connecter</button></form><p id="status" role="status"></p><section id="panel" hidden><h3>Panel RAW RP</h3><button id="logout" class="outline">Déconnexion</button><h3>Annonce</h3><textarea id="announcement" maxlength="2000" rows="5"></textarea><button id="save" class="cta">Enregistrer</button><div class="cards"><article><h3>Accueil</h3><a href="https://github.com/YayaLeFr/rawrp-site/edit/main/index.html">Modifier sur GitHub</a></article><article><h3>Règlement</h3><a href="https://github.com/YayaLeFr/rawrp-site/edit/main/reglement.html">Modifier sur GitHub</a></article><article><h3>Astuces</h3><a href="https://github.com/YayaLeFr/rawrp-site/edit/main/astuces.html">Modifier sur GitHub</a></article><article><h3>Réseaux</h3><a href="https://github.com/YayaLeFr/rawrp-site/edit/main/config.js">Modifier sur GitHub</a></article><article><h3>Galerie</h3><a href="https://github.com/YayaLeFr/rawrp-site/edit/main/galerie.html">Modifier sur GitHub</a></article><article><h3>Divers</h3><a href="https://github.com/YayaLeFr/rawrp-site/edit/main/divers.html">Modifier sur GitHub</a></article></div></section></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const s=createClient('https://lbnzlomhigogpcjvqluo.supabase.co','sb_publishable_46D0xxSoT8ebww-sxV_YLQ_WQnA-OOV');const $=id=>document.getElementById(id);async function check(){const {data:{user}}=await s.auth.getUser();if(!user)return;const {data,error}=await s.from('rawrp_admins').select('email').maybeSingle();if(error||!data){await s.auth.signOut();$('status').textContent='Accès non autorisé.';return} $('login').hidden=true;$('panel').hidden=false;const a=await s.from('rawrp_announcements').select('body').eq('id',1).single();$('announcement').value=a.data?.body||'';} $('login').onsubmit=async e=>{e.preventDefault();const {error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';$('status').textContent=error?'Identifiants incorrects.':'';if(!error)await check()};$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};$('save').onclick=async()=>{const {data,error}=await s.from('rawrp_announcements').update({body:$('announcement').value}).eq('id',1).select('id');$('status').textContent=error||!data?.length?'Enregistrement refusé.':'Annonce enregistrée.'};check();</script></body></html>
